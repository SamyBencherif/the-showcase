<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2026-10-08</title>
  <!-- Port of 2026-10-08.py (Pythonista scene): a ring of drifting dots. Touch
       to pull them in; let go and they fly off and bounce around. -->
  <script src="lib/scene.js"></script>
</head>
<body style="background: #333">
  <script>
    'use strict';

    const { random } = Math;

    runScene({
      setup() {
        this.g = null;
        this.p = [];
        for (let i = 0; i < 10000; i++) {
          const x = random() * this.size.w;
          const y = random() * this.size.h;
          const cd = (x - this.size.w / 2) ** 2 + (y - this.size.h / 2) ** 2;
          if (100 ** 2 < cd && cd < 200 ** 2) this.p.push([x, y, 0, 0]);
        }
      },

      update() {
        const { ctx } = this;
        const { w, h } = this.size;

        // Pythonista's default fill is white.
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        for (const p of this.p) {
          ctx.moveTo(p[0] + 1, p[1]);
          ctx.arc(p[0], p[1], 1, 0, Math.PI * 2);

          p[0] += random() - 0.5;
          p[1] += random() - 0.5;

          p[0] += p[2] * this.dt;
          p[1] += p[3] * this.dt;

          if (p[0] < 0) p[2] = Math.abs(p[2]);
          if (p[1] < 0) p[3] = Math.abs(p[3]);
          if (p[0] > w) p[2] = -Math.abs(p[2]);
          if (p[1] > h) p[3] = -Math.abs(p[3]);

          if (this.g) {
            const f = 300 / (1 + ((this.g.x - p[0]) ** 2 + (this.g.y - p[1]) ** 2) ** 0.5);
            p[2] = (this.g.x - p[0]) * f;
            p[3] = (this.g.y - p[1]) * f;
          }
        }
        ctx.fill();
      },

      touchBegan(touch) {
        this.g = touch.location;
      },

      touchMoved(touch) {
        this.g = touch.location;
      },

      touchEnded() {
        this.g = null;
      },
    });
  </script>
</body>
</html>
